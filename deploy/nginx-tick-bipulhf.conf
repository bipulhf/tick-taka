# /etc/nginx/sites-available/tick-bipulhf: the web app on tick.bipulhf.dev and the API on
# api.tick.bipulhf.dev, HTTPS included. Get both certificates first, without letting
# certbot edit this file:
#   sudo certbot certonly --nginx -d tick.bipulhf.dev --deploy-hook "systemctl reload nginx"
#   sudo certbot certonly --nginx -d api.tick.bipulhf.dev --deploy-hook "systemctl reload nginx"
# The API listens on 127.0.0.1:3003 (PORT in apps/api/.env, with TRUST_PROXY=true and
# WEB_ORIGINS=https://tick.bipulhf.dev). The web app is built with
# VITE_API_URL=https://api.tick.bipulhf.dev and copied to /var/www/tick-taka/app.

# Plain HTTP only answers certbot's challenge and sends everyone else to HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name tick.bipulhf.dev api.tick.bipulhf.dev;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# tick.bipulhf.dev: the public home, privacy and terms (from the API) and the web app.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name tick.bipulhf.dev;

    ssl_certificate /etc/letsencrypt/live/tick.bipulhf.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tick.bipulhf.dev/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # The public pages, their font and the site's icons come from the API.
    location ~ ^/(privacy|terms|favicon\.ico|favicon\.svg|apple-touch-icon\.png)?$ {
        proxy_pass http://127.0.0.1:3003;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /site/ {
        proxy_pass http://127.0.0.1:3003;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location = /app {
        return 301 /app/;
    }

    # The web app. Any path under /app/ that isn't a file is one of the app's own routes,
    # so it gets index.html. add_header in a location drops the server's, so HSTS is
    # repeated here.
    location /app/ {
        alias /var/www/tick-taka/app/;
        try_files $uri $uri/ /app/index.html;
        # The session token lives in the browser, so scripts may only come from this
        # site and Google's sign-in; requests go to this site, the API and Google.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://accounts.google.com/gsi/client; style-src 'self' 'unsafe-inline' https://accounts.google.com/gsi/style; frame-src https://accounts.google.com/gsi/; connect-src 'self' https://api.tick.bipulhf.dev https://accounts.google.com/gsi/; img-src 'self' data: blob: https://*.googleusercontent.com; media-src 'self' blob:; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        # Google's sign-in popup has to talk back to the page that opened it.
        add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        # index.html names the current build's files, so it is never cached.
        add_header Cache-Control "no-cache" always;
    }

    # Built files carry a hash in their names: cache them for good.
    location /app/assets/ {
        alias /var/www/tick-taka/app/assets/;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    location / {
        return 404;
    }
}

# api.tick.bipulhf.dev: the API, for the web app and the Android app.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.tick.bipulhf.dev;

    ssl_certificate /etc/letsencrypt/live/api.tick.bipulhf.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.tick.bipulhf.dev/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Receipt photos; Nginx rejects anything over 1 MB by default.
    client_max_body_size 10M;

    # The public pages live on tick.bipulhf.dev, where their links work.
    location ~ ^/(privacy|terms)?$ {
        return 301 https://tick.bipulhf.dev$request_uri;
    }

    location / {
        proxy_pass http://127.0.0.1:3003;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # The login rate limit reads this header (with TRUST_PROXY=true in the API's .env).
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The JSON export streams a whole account, page by page; a long history can take
    # longer than Nginx's default 60 s between writes on a slow connection.
    location = /export {
        proxy_pass http://127.0.0.1:3003;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_buffering off;
    }

    # AI calls: each model request times out after 25 s and is retried once, and the
    # assistant streams with a keepalive every 15 s. 120 s matches Bun's idleTimeout,
    # so Nginx never cuts a reply off with its default 60 s and an HTML 504.
    location /ai/ {
        proxy_pass http://127.0.0.1:3003;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        # Server-sent events from /ai/assistant go out as they are written.
        proxy_buffering off;
    }
}
