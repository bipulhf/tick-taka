# /etc/nginx/sites-available/tick-taka — run `sudo certbot --nginx -d tick.mehedismathacademy.com`
# afterwards to add HTTPS and the HTTP→HTTPS redirect.
server {
    listen 80;
    server_name tick.mehedismathacademy.com;

    # Receipt photos; Nginx rejects anything over 1 MB by default.
    client_max_body_size 10M;

    location / {
        proxy_pass http://127.0.0.1:3003;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # The login rate limit reads this header.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
